esphome:
  name: makeskyblue-mppt
  friendly_name: MakeSkyBlue MPPT

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1" # Уменьшает размер бинарного файла
      sram1_as_iram: true # Освобождает +40 КБ оперативной памяти (SRAM)

# Подключаем ваш опубликованный репозиторий напрямую из GitHub
external_components:
  - source: github://pikerr/esphome-makeskyblue-uart
    refresh: 2s

api:
ota:
  - platform: esphome

web_server:
  port: 80

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: msb-uart Fallback Hotspot
    password: "11111111"

uart:
  - id: uart_makeskyblue
    tx_pin: GPIO16
    rx_pin: GPIO17
    baud_rate: 9600
#    debug:
#      direction: BOTH
#      dummy_receiver: false
#      after:
#        bytes: 1
#      sequence:
#        - lambda: UARTDebug::log_hex(direction, bytes, ' ');

# stream_server:
#   id: my_stream_server
#   uart_id: uart_makeskyblue
#   port: 6666       # Порт TCP сокета

makeskyblue_uart:
  id: msb
  uart_id: uart_makeskyblue
  update_interval: 10s
  stream_port: 6666 # Встроенный параллельный TCP-стрим порт для отладки

sensor:
  - platform: makeskyblue_uart
    makeskyblue_uart_id: msb
    solar_voltage:
      id: msb_solar_voltage
      name: "01 Input Voltage"
    solar_power:
      id: msb_solar_power
      name: "02 Input Power"
    battery_voltage:
      id: msb_battery_voltage
      name: "03 Battery Voltage"
    battery_current:
      id: msb_battery_current
      name: "04 Battery Current"
    temperature:
      id: msb_temperature
      name: "11 Temperature"
    accumulated_kwh:
      id: msb_accumulated_kwh
      name: "12 Accumulated kWh"
    last_seen_seconds:
      id: msb_last_seen_seconds
      name: "90 Seconds Since Last Msg"
    last_register:
      id: msb_last_register
      name: "91 Last Register Code"

binary_sensor:
  - platform: makeskyblue_uart
    makeskyblue_uart_id: msb
    link_connected:
      id: msb_link_connected
      name: "21 UART Connection"
    mppt_mode:
      id: msb_mppt_mode
      name: "22 MPPT Mode"

number:
  - platform: makeskyblue_uart
    makeskyblue_uart_id: msb
    bulk_voltage:
      id: msb_bulk_voltage
      name: "31 Bulk Voltage"
    float_voltage:
      id: msb_float_voltage
      name: "32 Float Voltage"
    max_charge_current:
      id: msb_max_charge_current
      name: "33 Max Current"

select:
  - platform: makeskyblue_uart
    makeskyblue_uart_id: msb
    battery_type:
      id: msb_battery_type
      name: "34 Battery Type"
